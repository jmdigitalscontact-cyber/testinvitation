---
deployment:
  tasks:
    - export DEPLOYPATH=/home/adn391j6zhrq/public_html/

    # Website root files
    - /bin/cp index.html gallery.html player.html sw.js $DEPLOYPATH

    # Static asset folders
    - /bin/cp -R css js images audio $DEPLOYPATH

    # App folders (RSVP backend + reception venue)
    - /bin/cp -R rsvp reception $DEPLOYPATH

    # Hidden security files (dotfiles do not match wildcards)
    - /bin/cp .htaccess $DEPLOYPATH

    # Ensure runtime folders exist (they may not be in git)
    - /bin/mkdir -p $DEPLOYPATH/logs
    - /bin/mkdir -p $DEPLOYPATH/rsvp/qr_codes
    - /bin/mkdir -p $DEPLOYPATH/reception/uploads

    # Set writable permissions for runtime folders
    - /bin/chmod 755 $DEPLOYPATH/logs
    - /bin/chmod 755 $DEPLOYPATH/rsvp/qr_codes
    - /bin/chmod 755 $DEPLOYPATH/reception/uploads

